<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GNZ Admin</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{min-height:100vh;background:#050509;color:#e8ecff;padding:18px;}
    button,input,select,textarea{font:inherit;}
    .app{max-width:1280px;margin:0 auto;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;padding:18px;border-radius:18px;background:rgba(18,18,28,.96);border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 40px rgba(0,0,0,.55);}
    .brand h1{font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#fff;}
    .brand p{font-size:13px;color:#9fb7ff;margin-top:4px;}
    .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
    .language-switch{display:flex;justify-content:center;gap:6px;}
    .login .language-switch{margin:0 auto 14px;}
    .lang-btn{width:auto;min-width:44px;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#f6efe2;font-size:12px;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:.2s ease;}
    .lang-btn.active{background:var(--gnz-red);border-color:var(--gnz-gold);color:#fffaf1;box-shadow:0 10px 22px rgba(165,30,34,.25);}
    .btn{border:none;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;transition:.2s;background:#202231;color:#e8ecff;border:1px solid rgba(255,255,255,.08);}
    .btn:hover{transform:translateY(-1px);background:#292b3d;}
    .btn.primary{background:linear-gradient(120deg,#0b5ed7,#2563eb);color:#fff;box-shadow:0 12px 26px rgba(11,94,215,.35);}
    .btn.success{background:#198754;color:#fff;}
    .btn.warn{background:#f59e0b;color:#111827;}
    .btn.danger{background:#dc3545;color:#fff;}
    .btn.info{background:#0d6efd;color:#fff;}
    .login{max-width:430px;margin:12vh auto 0;padding:24px;border-radius:22px;background:rgba(18,18,28,.98);border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 60px rgba(0,0,0,.65);}
    .login-icon{width:66px;height:66px;border-radius:22px;background:linear-gradient(145deg,#0b5ed7,#4ea3ff);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;}
    .login h2{text-align:center;margin-bottom:8px;}
    .login p{text-align:center;color:#aebbea;font-size:14px;line-height:1.5;margin-bottom:18px;}
    .field{position:relative;margin-bottom:13px;}
    .field i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7f8bb8;}
    .field input,.field select,.field textarea{width:100%;border:none;border-radius:12px;background:#181820;color:#e8ecff;padding:12px 12px 12px 38px;outline:none;box-shadow:0 0 0 1px rgba(255,255,255,.04);}
    .field textarea{min-height:78px;resize:vertical;}
    .field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 1px #0b5ed7,0 0 14px rgba(11,94,215,.35);}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start;}
    .panel{background:rgba(18,18,28,.96);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.42);}
    .panel h2{font-size:18px;margin-bottom:14px;color:#fff;}
    .filters{display:grid;grid-template-columns:1.4fr .75fr .75fr auto;gap:10px;margin-bottom:14px;}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
    .stat{padding:12px;border-radius:14px;background:#151722;border:1px solid rgba(255,255,255,.06);}
    .stat strong{display:block;font-size:20px;color:#fff;}
    .stat span{font-size:12px;color:#9fb7ff;text-transform:uppercase;letter-spacing:.05em;}
    .list{display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow:auto;padding-right:4px;}
    .view-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
    .view-btn{border:none;border-radius:10px;padding:10px 12px;background:rgba(6,63,76,.08);color:var(--gnz-teal);font-weight:900;cursor:pointer;}
    .view-btn.active{background:var(--gnz-teal);color:#fffaf1;}
    .calendar-view{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;}
    .calendar-day{min-height:118px;border-radius:13px;background:#fffdf8;border:1px solid rgba(6,63,76,.14);padding:9px;overflow:hidden;}
    .calendar-date{font-weight:900;color:var(--gnz-teal);font-size:13px;margin-bottom:7px;}
    .calendar-item{display:block;width:100%;margin:5px 0;padding:7px;border-radius:9px;background:rgba(6,63,76,.08);color:var(--gnz-ink);font-size:12px;line-height:1.25;border:none;border-left:3px solid var(--gnz-red);text-align:left;cursor:pointer;}
    .calendar-item strong{display:block;color:var(--gnz-teal);font-size:12px;}
    .card{border-radius:15px;background:#12141e;border:1px solid rgba(255,255,255,.07);padding:13px;}
    .card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;}
    .card-title strong{display:block;color:#fff;font-size:15px;}
    .card-title span{display:block;color:#aebbea;font-size:12px;margin-top:2px;}
    .badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;}
    .badge.Pendiente{background:#fef3c7;color:#92400e;}
    .badge.Confirmada{background:#dcfce7;color:#166534;}
    .badge.Cancelada{background:#fee2e2;color:#991b1b;}
    .badge.Completada{background:#dbeafe;color:#1d4ed8;}
    .details{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 10px;color:#c9d3f6;font-size:13px;margin-bottom:10px;}
    .details span{color:#7f8bb8;}
    .actions{display:flex;flex-wrap:wrap;gap:8px;}
    .actions .btn{padding:8px 10px;font-size:12px;border-radius:10px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .full{grid-column:1/-1;}
    .price-box{margin:4px 0 12px;padding:12px;border-radius:14px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.24);color:#cfe2ff;font-weight:800;}
    .checkline{display:flex;gap:10px;align-items:flex-start;color:#c9d3f6;font-size:13px;line-height:1.45;margin:8px 0 12px;}
    .checkline input{margin-top:3px;}
    .message{margin-top:12px;color:#cfe2ff;font-weight:700;font-size:14px;}
    .form-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;padding:5px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);}
    .tab-btn{border:none;border-radius:10px;padding:10px 12px;background:transparent;color:#c9d3f6;font-weight:800;cursor:pointer;}
    .tab-btn.active{background:#0b5ed7;color:#fff;box-shadow:0 10px 22px rgba(11,94,215,.24);}
    .service-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;background:rgba(10,132,255,.12);color:#cfe2ff;}
    .discount-admin-list{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
    .discount-admin-card{border-radius:13px;background:#fffdf8;border:1px solid rgba(6,63,76,.14);padding:12px;color:var(--gnz-ink);}
    .discount-admin-card strong{display:block;color:var(--gnz-teal);font-size:15px;}
    .discount-admin-card p{margin:5px 0 0;color:#5d6d72;font-size:13px;line-height:1.4;}
    .discount-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
    .discount-flag{padding:4px 8px;border-radius:999px;background:rgba(6,63,76,.08);color:var(--gnz-teal);font-size:11px;font-weight:900;text-transform:uppercase;}
    .hidden{display:none!important;}
    .empty{text-align:center;color:#8f9ac5;padding:24px;}
    @media(max-width:980px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){
      body{padding:8px;font-size:16px;}
      .app{max-width:100%;}
      .login{margin:7vh auto 0;padding:20px;border-radius:18px;}
      .topbar{position:sticky;top:0;z-index:20;align-items:flex-start;flex-direction:column;padding:14px;border-radius:16px;background:rgba(18,18,28,.98);}
      .topbar .btn{width:100%;min-height:46px;}
      .top-actions{width:100%;display:grid;grid-template-columns:1fr;gap:8px;}
      .top-actions .language-switch{justify-content:flex-start;}
      .brand h1{font-size:19px;}
      .brand p{font-size:12px;line-height:1.4;}
      .grid{gap:12px;}
      .panel{padding:12px;border-radius:16px;}
      .panel h2{font-size:17px;}
      .filters,.form-grid{grid-template-columns:1fr;gap:8px;}
      .stats{grid-template-columns:1fr 1fr;gap:8px;}
      .stat{padding:10px;border-radius:12px;}
      .stat strong{font-size:18px;}
      .field{margin-bottom:9px;}
      .field input,.field select,.field textarea{min-height:46px;font-size:16px;padding-top:12px;padding-bottom:12px;}
      .btn{min-height:44px;}
      .list{max-height:none;overflow:visible;padding-right:0;}
      .calendar-view{grid-template-columns:1fr;}
      .calendar-day{min-height:auto;}
      .card{padding:12px;border-radius:14px;}
      .card-head{flex-direction:column;align-items:stretch;}
      .badge{width:max-content;}
      .details{grid-template-columns:1fr;font-size:13px;}
      .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
      .actions .btn{width:100%;font-size:12px;padding:10px 8px;}
      .price-box{font-size:14px;line-height:1.45;}
      .checkline{font-size:13px;}
      #saveBtn,#cancelEditBtn{min-height:48px;}
    }
    :root{--gnz-cream:#f6efe2;--gnz-panel:#fffaf1;--gnz-ink:#102a33;--gnz-teal:#063f4c;--gnz-red:#a51e22;--gnz-gold:#c9a46a;--gnz-line:rgba(6,63,76,.16);}
    body{background:linear-gradient(180deg,#fbf5e9 0%,#efe2cf 100%);color:var(--gnz-ink);}
    .topbar,.panel,.login,.card,.stat{background:rgba(255,250,241,.96);border-color:var(--gnz-line);box-shadow:0 20px 55px rgba(28,20,8,.18);}
    .topbar{background:linear-gradient(135deg,rgba(6,63,76,.95),rgba(16,42,51,.94));color:#fffaf1;}
    .brand{display:flex;align-items:center;gap:13px;}
    .brand-logo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,250,241,.9);box-shadow:0 10px 24px rgba(0,0,0,.25);}
    .brand h1,.panel h2,.login h2,.card-title strong,.stat strong{color:var(--gnz-teal);}
    .topbar .brand h1{color:#fffaf1;}
    .brand p,.login p,.details span,.stat span{color:#7c5555;}
    .topbar .brand p{color:#f1d7a2;}
    .login-logo{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:3px solid rgba(255,250,241,.9);box-shadow:0 16px 34px rgba(6,63,76,.28);}
    .login-icon{background:none;box-shadow:none;width:auto;height:auto;margin:0;}
    .field input,.field select,.field textarea{background:#fffdf8;color:var(--gnz-ink);border:1px solid rgba(6,63,76,.12);box-shadow:0 1px 0 rgba(255,255,255,.8);}
    .field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px rgba(6,63,76,.22),0 10px 24px rgba(6,63,76,.10);}
    .field i{color:var(--gnz-red);}
    .btn.primary{background:linear-gradient(120deg,var(--gnz-red),#d64235);box-shadow:0 14px 30px rgba(165,30,34,.25);}
    .btn{background:#123f4b;color:#fffaf1;border-color:rgba(255,255,255,.14);}
    .btn:hover{background:#0b303a;}
    .form-switch{background:rgba(6,63,76,.06);border-color:rgba(6,63,76,.12);}
    .tab-btn{color:#31515a;}
    .tab-btn.active{background:var(--gnz-teal);color:#fffaf1;box-shadow:0 12px 24px rgba(6,63,76,.18);}
    .service-tag{background:rgba(165,30,34,.1);color:var(--gnz-red);}
    .price-box{background:rgba(6,63,76,.08);border-color:rgba(6,63,76,.18);color:var(--gnz-teal);}
    .badge.Pendiente{background:#f8e3a4;color:#77510b;}
    .badge.Confirmada{background:#d9f0df;color:#0f5a31;}
    .badge.Cancelada{background:#f7d8d4;color:#8a1418;}
    .badge.Completada{background:#d6e7ef;color:#0f4e66;}
    .empty,.message,.checkline,.details{color:#344b52;}
    @media(max-width:640px){.brand{align-items:flex-start}.brand-logo{width:52px;height:52px}.login-logo{width:96px;height:96px}}
  </style>
</head>
<body>
  <div id="loginView" class="login">
    <div class="language-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="es">ES</button>
    </div>
    <div class="login-icon"><img class="login-logo" src="assets/img/gnz-logo.png" alt="GNZ Oil Services logo"></div>
    <h2>GNZ Admin</h2>
    <p data-i18n="loginSubtitle">Private appointment manager for GNZ Oil Services.</p>
    <div class="field">
      <i class="fa-solid fa-key"></i>
      <input type="password" id="adminPassword" placeholder="Admin password" autocomplete="current-password" data-i18n-placeholder="adminPassword">
    </div>
    <button class="btn primary" id="loginBtn" style="width:100%;" data-i18n="loginButton">Log In</button>
    <div class="message" id="loginMessage"></div>
  </div>

  <div id="appView" class="app hidden">
    <div class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/img/gnz-logo.png" alt="GNZ Oil Services logo">
        <div>
        <h1>GNZ Admin</h1>
        <p data-i18n="adminSubtitle">Reservations, scheduling, pricing, reminders and status updates.</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="language-switch" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
        </div>
        <button class="btn" id="refreshBtn"><i class="fa-solid fa-rotate"></i> <span data-i18n="refresh">Refresh</span></button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><strong id="statTotal">0</strong><span data-i18n="statTotal">Total</span></div>
      <div class="stat"><strong id="statPendientes">0</strong><span data-i18n="statPending">Pending</span></div>
      <div class="stat"><strong id="statConfirmadas">0</strong><span data-i18n="statConfirmed">Confirmed</span></div>
      <div class="stat"><strong id="statCompletadas">0</strong><span data-i18n="statCompleted">Completed</span></div>
      <div class="stat"><strong id="statHoy">0</strong><span data-i18n="statToday">Today</span></div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2 data-i18n="appointments">Appointments</h2>
        <div class="filters">
          <div class="field"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by ID, name, phone, email" inputmode="search" data-i18n-placeholder="searchPlaceholder"></div>
          <div class="field"><i class="fa-solid fa-calendar"></i><input type="date" id="filterDate"></div>
          <div class="field">
            <i class="fa-solid fa-filter"></i>
            <select id="filterStatus">
              <option value="" data-i18n="allStatuses">All statuses</option>
              <option value="Pendiente" data-i18n="statusPending">Pending</option>
              <option value="Confirmada" data-i18n="statusConfirmed">Confirmed</option>
              <option value="Cancelada" data-i18n="statusCanceled">Canceled</option>
              <option value="Completada" data-i18n="statusCompleted">Completed</option>
            </select>
          </div>
          <button class="btn primary" id="searchBtn" data-i18n="search">Search</button>
        </div>
        <div class="view-toggle" aria-label="Appointment view">
          <button class="view-btn active" type="button" data-appointments-view="list"><i class="fa-solid fa-list"></i> <span data-i18n="listView">List</span></button>
          <button class="view-btn" type="button" data-appointments-view="calendar"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="calendarView">Calendar</span></button>
        </div>
        <div id="reservasList" class="list"></div>
        <div id="calendarView" class="calendar-view hidden"></div>
      </section>

      <section class="panel">
        <h2 id="formTitle">Schedule Oil Appointment</h2>
        <div class="form-switch" aria-label="Appointment type">
          <button class="tab-btn active" type="button" data-admin-form="oil"><i class="fa-solid fa-oil-can"></i> <span data-i18n="oilTab">Oil</span></button>
          <button class="tab-btn" type="button" data-admin-form="brake"><i class="fa-solid fa-screwdriver-wrench"></i> <span data-i18n="brakeTab">Brakes / Flush</span></button>
          <button class="tab-btn" type="button" data-admin-form="discounts"><i class="fa-solid fa-percent"></i> <span data-i18n="discountTab">Discounts</span></button>
        </div>
        <form id="adminForm" class="service-form">
          <input type="hidden" name="idioma" id="adminLangField">
          <div class="form-grid">
            <div class="field"><i class="fa-solid fa-user"></i><input name="nombre" id="nombre" placeholder="Full name" autocomplete="name" required data-i18n-placeholder="fullName"></div>
            <div class="field"><i class="fa-solid fa-phone"></i><input name="telefono" id="telefono" placeholder="Phone" inputmode="tel" autocomplete="tel" required data-i18n-placeholder="phone"></div>
            <div class="field full"><i class="fa-solid fa-envelope"></i><input name="correo" id="correo" type="email" placeholder="Email" autocomplete="email" required data-i18n-placeholder="email"></div>
            <div class="field"><i class="fa-solid fa-car"></i><select name="marca" id="marcaSelect" required><option value="" data-i18n="selectMake">Select Make</option></select></div>
            <div class="field"><i class="fa-solid fa-car-side"></i><select name="modelo" id="modeloSelect" required><option value="" data-i18n="selectModel">Select Model</option></select></div>
            <div class="field"><i class="fa-solid fa-calendar-days"></i><select name="ano" id="anoSelect" required><option value="" data-i18n="selectYear">Select Year</option></select></div>
            <div class="field" id="motorGroup" style="display:none;"><i class="fa-solid fa-gears"></i><select name="motor" id="motorSelect"></select></div>
            <div class="field full"><i class="fa-solid fa-oil-can"></i><select name="marcaAceite" id="marcaAceite" required><option value="" data-i18n="selectOil">Select Engine Oil</option></select></div>
            <div class="field full"><i class="fa-solid fa-location-dot"></i><input name="direccion" id="direccion" placeholder="Service address" autocomplete="street-address" required data-i18n-placeholder="serviceAddress"></div>
            <div class="field"><i class="fa-solid fa-calendar-day"></i><input type="date" name="fecha" id="fecha" required></div>
            <div class="field"><i class="fa-solid fa-clock"></i><input type="time" name="hora" id="hora" required></div>
            <div class="field full"><i class="fa-solid fa-list-check"></i><select name="estado" id="estado"><option value="Confirmada" data-i18n="statusConfirmed">Confirmed</option><option value="Pendiente" data-i18n="statusPending">Pending</option></select></div>
            <div class="field full"><i class="fa-solid fa-comment"></i><textarea name="comentarios" id="comentarios" placeholder="Notes" data-i18n-placeholder="notes"></textarea></div>
          </div>
          <div class="price-box" id="priceBox">Estimated price: N/A</div>
          <label class="checkline"><input type="checkbox" name="aceptoAcuerdo" id="aceptoAcuerdo" value="SI" checked> <span data-i18n="agreementAdmin">Agreement accepted verbally or by the customer.</span></label>
          <label class="checkline"><input type="checkbox" name="notificarCliente" id="notificarCliente" value="SI" checked> <span data-i18n="notifyAdmin">Send confirmation email and PDF receipt to customer.</span></label>
          <button class="btn primary" type="submit" id="saveBtn" style="width:100%;" data-i18n="createAppointment">Create Appointment</button>
          <button class="btn hidden" type="button" id="cancelEditBtn" style="width:100%;margin-top:8px;" data-i18n="cancelEdit">Cancel Edit</button>
          <div class="message" id="formMessage"></div>
        </form>

        <form id="adminBrakeForm" class="service-form hidden">
          <input type="hidden" name="Language" id="adminBrakeLangField">
          <div class="form-grid">
            <div class="field"><i class="fa-solid fa-user"></i><input name="Full Name" id="brakeFullName" placeholder="Full name" autocomplete="name" required data-i18n-placeholder="fullName"></div>
            <div class="field"><i class="fa-solid fa-phone"></i><input name="Phone" id="brakePhone" placeholder="Phone" inputmode="tel" autocomplete="tel" required data-i18n-placeholder="phone"></div>
            <div class="field full"><i class="fa-solid fa-envelope"></i><input name="Email" id="brakeEmail" type="email" placeholder="Email" autocomplete="email" required data-i18n-placeholder="email"></div>
            <div class="field"><i class="fa-solid fa-screwdriver-wrench"></i><select name="Service" id="adminBrakeService" required>
              <option value="" data-i18n="selectService">Select Service</option>
              <option value="pads" data-i18n="servicePads">Brake Pads Only</option>
              <option value="combo" data-i18n="serviceCombo">Rotors + Pads</option>
              <option value="flush" data-i18n="serviceFlush">Flush Service</option>
            </select></div>
            <div class="field" id="adminBrakeAxleBox" style="display:none;"><i class="fa-solid fa-circle-dot"></i><select name="Axles" id="adminBrakeAxles">
              <option value="1" data-i18n="axle1">1 axle</option>
              <option value="2" data-i18n="axle2">2 axles</option>
              <option value="3" data-i18n="axle3">3 axles</option>
              <option value="4" data-i18n="axle4">4 axles</option>
            </select></div>
            <div class="field" id="adminBrakeFlushBox" style="display:none;"><i class="fa-solid fa-droplet"></i><select name="FlushType" id="adminBrakeFlushType">

    function getPreferredLanguage() {
      const saved = localStorage.getItem("gnzLang");
      if (saved === "es" || saved === "en") return saved;
      return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
    }

    function t(key) {
      return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
    }

    function statusLabel(status) {
      const map = {
        Pendiente: "statusPending",
        Confirmada: "statusConfirmed",
        Cancelada: "statusCanceled",
        Completada: "statusCompleted"
      };
      return t(map[status] || "") || status || t("notAvailable");
    }

        formTitle.textContent = t("scheduleBrake");
      } else {
        formTitle.textContent = t("manageDiscounts");
      }
    }

    function applyLanguage(lang) {
      currentLang = lang === "es" ? "es" : "en";
      localStorage.setItem("gnzLang", currentLang);
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll("[data-lang]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });
      document.getElementById("adminLangField").value = currentLang;
      document.getElementById("adminBrakeLangField").value = currentLang;
      setFormTitle();
      updatePlaceholders();
      calcularPrecio();
      updateAdminBrakePrice();
      if (reservasCache.length) renderAppointmentView();
      renderDescuentos(descuentosCache);

      loginMessage.textContent = t("checkingAccess");
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) {
            loginMessage.textContent = (res && res.error) || t("unableLogin");
            return;
          }
          adminToken = res.token;
          loginView.classList.add("hidden");
          appView.classList.remove("hidden");
          cargarVehiculos();
          cargarReservas();
          cargarDescuentos();
        })
        .withFailureHandler(err => {
          loginMessage.textContent = err.message || t("loginFailed");

        .adminLogin(document.getElementById("adminPassword").value);

      activeFormType = type === "brake" ? "brake" : type === "discounts" ? "discounts" : "oil";

      document.querySelectorAll("[data-admin-form]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.adminForm === activeFormType);
      });

      adminOilForm.classList.toggle("hidden", activeFormType !== "oil");
      adminBrakeForm.classList.toggle("hidden", activeFormType !== "brake");
      adminDiscountSection.classList.toggle("hidden", activeFormType !== "discounts");

      if (activeFormType === "oil") {
        setFormTitle();
      } else if (activeFormType === "brake") {
        if (editingId) resetFormMode();
        setFormTitle();
        updateAdminBrakeOptions();
      } else {
        if (editingId) resetFormMode();
        setFormTitle();
        cargarDescuentos();

        .withSuccessHandler(data => {

            vehiculos = data.vehiculos || [];
            preciosAceite = data.precios || [];
          } else {
            vehiculos = data || [];
            preciosAceite = [];
          }

          renderMarcas();
        })
        .withFailureHandler(showFormError)
        .adminObtenerCatalogo(adminToken);

    function renderMarcas() {
      const marcas = [...new Set(vehiculos.map(v => String(v.marca || "").trim().toLowerCase()).filter(Boolean))].sort();
      marcaSelect.innerHTML = placeholderOption("selectMake");
      marcas.forEach(m => addOption(marcaSelect, m, m));

      modeloSelect.innerHTML = placeholderOption("selectModel");
      anoSelect.innerHTML = placeholderOption("selectYear");
      resetMotor();
      resetOil();
      const modelos = vehiculos
        .filter(v => String(v.marca || "").trim().toLowerCase() === marcaSelect.value)
        .map(v => String(v.modelo || "").trim().toLowerCase())
        .filter(Boolean);
      [...new Set(modelos)].forEach(m => addOption(modeloSelect, m, m));
    });

    modeloSelect.addEventListener("change", () => {
      anoSelect.innerHTML = placeholderOption("selectYear");
      resetMotor();
      resetOil();
      const anos = vehiculos
        .filter(v => String(v.marca || "").trim().toLowerCase() === marcaSelect.value &&
                     String(v.modelo || "").trim().toLowerCase() === modeloSelect.value)
        .map(v => String(v.ano || "").trim())
        .filter(Boolean);
      [...new Set(anos)].sort().forEach(a => addOption(anoSelect, a, a));
    });

      resetMotor();
      resetOil();
      if (!anoSelect.value || !marcaSelect.value || !modeloSelect.value) return;

      const motorMap = new Map();
      vehiculos
        .filter(v =>
          String(v.ano || "").trim() === anoSelect.value &&
          normalizar(v.marca) === normalizar(marcaSelect.value) &&
          normalizar(v.modelo) === normalizar(modeloSelect.value)
        )
        .map(v => String(v.motor || "").trim())
        .filter(Boolean)
        .forEach(m => {
          const key = normalizarMotor(m);
          if (!motorMap.has(key)) motorMap.set(key, m);
        });

      const list = Array.from(motorMap.values()).sort();

      if (!list.length) {
        cargarAceites(selectedOil);
        return;
      }

      motorGroup.style.display = "block";
      motorSelect.required = true;
      motorSelect.innerHTML = "";
      if (list.length > 1) addOption(motorSelect, "", t("selectEngine"));
      list.forEach(m => addOption(motorSelect, m, m));

      if (selectedMotor && list.some(m => normalizarMotor(m) === normalizarMotor(selectedMotor))) {
        motorSelect.value = list.find(m => normalizarMotor(m) === normalizarMotor(selectedMotor));
        cargarAceites(selectedOil);
      } else if (list.length === 1) {
        motorSelect.value = list[0];
        cargarAceites(selectedOil);
      }
    }

    function cargarAceites(selectedOil) {
      resetOil();
      if (!anoSelect.value || !marcaSelect.value || !modeloSelect.value) return;
      if (motorSelect.required && !motorSelect.value) return;

      const matches = getVehicleMatches();
      const tipos = [...new Set(matches.map(v => normalizar(v.aceite)).filter(Boolean))];
      const aceites = [...new Set(preciosAceite
        .filter(p => tipos.indexOf(normalizar(p.tipo)) !== -1)
        .map(p => p.marca)
        .filter(Boolean))]
        .sort();

      marcaAceite.innerHTML = placeholderOption("selectOil");
      aceites.forEach(a => addOption(marcaAceite, a, a));

      if (selectedOil) {
        setSelectValue(marcaAceite, selectedOil);
      }

      if (marcaAceite.value) calcularPrecio();
    }

    function calcularPrecio() {
      if (!marcaAceite.value || !modeloSelect.value || !anoSelect.value) return;
      if (motorSelect.required && !motorSelect.value) return;

      const estimate = calcularPrecioLocal();
      if (!estimate) {
        priceBox.textContent = `${t("estimatedPrice")}: ${t("notAvailable")}`;
        return;
      }

      const discountText = estimate.discountRate > 0
        ? ` | ${t("subtotal")} $${estimate.baseTotal} | ${t("discountLabel")} -${formatPercent(estimate.discountRate)}`
        : "";
      priceBox.textContent = `${t("estimatedPrice")}: $${estimate.total}${discountText} | ${t("oil")} $${estimate.aceite} | ${t("filter")} $${estimate.filtro} | ${t("labor")} $${estimate.manoObra} | ${t("disposal")} $${estimate.desecho}`;
    }

    function updateAdminBrakeOptions() {
      const service = adminBrakeService.value;
      adminBrakeAxleBox.style.display = (service === "pads" || service === "combo") ? "block" : "none";
      adminBrakeFlushBox.style.display = service === "flush" ? "block" : "none";
      updateAdminBrakePrice();
    }

    function getAdminBrakeQuote() {
      const form = new FormData(adminBrakeForm);
      const service = form.get("Service");
      const body = form.get("Body");
      const axles = Number(form.get("Axles"));
      const flushType = form.get("FlushType");

      if (!service || !body) return null;

      let price = 0;
      let serviceName = "";

      if (service === "pads" || service === "combo") {
        if (!axles || axles < 1 || axles > 4) return null;
        serviceName = service === "pads" ? t("servicePads") : t("serviceCombo");
        price = brakePrices[service][body][axles - 1];
      }

      if (service === "flush") {
        if (flushType !== "regular" && flushType !== "complete") return null;
        serviceName = flushType === "regular" ? t("flushRegular") : t("flushComplete");
        price = brakePrices.flush[body][flushType];
      }

      if (!price) return null;

      const discountRate = getAdminDiscountRateFromText(document.getElementById("brakeComment").value);
      const finalPrice = applyAdminDiscount(price, discountRate);

      return {
        service: service,
        serviceName: serviceName,
        basePrice: formatMoney(price),
        discountRate: discountRate,
        discountPercent: Number((discountRate * 100).toFixed(2)),
        price: formatMoney(finalPrice)
      };
    }

    function updateAdminBrakePrice() {
      const quote = getAdminBrakeQuote();
      if (!quote) {
        brakePriceBox.textContent = `${t("estimatedPrice")}: ${t("notAvailable")}`;
        return;
      }

      const discountText = quote.discountRate > 0
        ? ` | ${t("subtotal")} $${quote.basePrice} | ${t("discountLabel")} -${formatPercent(quote.discountRate)}`
        : "";
      brakePriceBox.textContent = `${t("estimatedPrice")}: $${quote.price}${discountText} | ${quote.serviceName}`;
    }

    document.getElementById("adminForm").addEventListener("submit", e => {
      e.preventDefault();

            return;
          }
          formMessage.textContent = editingId ? `${t("appointmentUpdated")} ${res.id}` : `${t("appointmentCreated")} ${res.id}`;

        })

          saveBtn.disabled = false;
          showFormError(err);

    adminBrakeForm.addEventListener("submit", e => {
      e.preventDefault();

      const quote = getAdminBrakeQuote();
      if (!quote) {
        brakeFormMessage.textContent = t("brakeIncomplete");
        return;
      }

      brakeFormMessage.textContent = t("savingBrake");

      payload.discountRate = quote.discountRate;

      google.script.run
        .withSuccessHandler(res => {

          if (!res || !res.success) {
            brakeFormMessage.textContent = (res && (res.error || res.message)) || t("brakeSavedFail");

    function cargarDescuentos() {
      if (!adminToken) return;
      discountList.innerHTML = `<div class="empty">${t("loadingDiscounts")}</div>`;
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) {
            discountList.innerHTML = `<div class="empty">${escapeHtml((res && res.error) || t("discountSaveFail"))}</div>`;
            return;
          }
          descuentosCache = res.discounts || [];
          renderDescuentos(descuentosCache);
          calcularPrecio();
          updateAdminBrakePrice();
        })
        .withFailureHandler(err => {
          discountList.innerHTML = `<div class="empty">${escapeHtml(err.message || t("discountSaveFail"))}</div>`;
        })
        .adminListarDescuentos(adminToken);
    }

    function renderDescuentos(discounts) {
      if (!discountList) return;
      if (!discounts || !discounts.length) {
        discountList.innerHTML = `<div class="empty">${t("noDiscounts")}</div>`;
        return;
      }

      discountList.innerHTML = discounts.map(d => `
        <article class="discount-admin-card">
          <strong>${escapeHtml(d.code)} - ${escapeHtml(d.percent)}%</strong>

          <p>${escapeHtml(d.description || "")}</p>
          <p>${t("discountExpires")}: ${escapeHtml(d.expiresAt || t("notAvailable"))} | ${t("discountUsage")}: ${escapeHtml(d.uses || 0)}${d.usageLimit ? " / " + escapeHtml(d.usageLimit) : ""}</p>
          <div class="discount-flags">
            <span class="discount-flag">${d.active ? t("activeDiscount") : t("inactiveDiscount")}</span>
            <span class="discount-flag">${d.public ? t("publicDiscount") : t("privateDiscount")}</span>
            ${d.expired ? `<span class="discount-flag">${escapeHtml(t("discountExpires"))}</span>` : ""}
            ${d.limitReached ? `<span class="discount-flag">${escapeHtml(t("discountUsageLimit"))}</span>` : ""}

    function guardarDescuento(e) {

        .withSuccessHandler(res => {

          }
          discountMessage.textContent = `${t("discountSaved")} ${res.discount.code}`;

        })

      document.getElementById("discountExpires").value = "";

          }
          discountMessage.textContent = `${t("discountDeleted")} ${res.code}`;

    function cargarReservas() {
      const filtros = {
        query: document.getElementById("searchInput").value,
        fecha: document.getElementById("filterDate").value,
        estado: document.getElementById("filterStatus").value,
        limit: 300
      };

      reservasList.innerHTML = `<div class="empty">${t("loadingAppointments")}</div>`;
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) {
            reservasList.innerHTML = `<div class="empty">${t("unableAppointments")}</div>`;
            return;
          }
          renderStats(res.resumen || {});
          reservasCache = res.reservas || [];
          renderAppointmentView();
        })
        .withFailureHandler(err => {
          reservasList.innerHTML = `<div class="empty">${escapeHtml(err.message || t("unableAppointments"))}</div>`;
        })
        .adminListarReservas(adminToken, filtros);

    function renderStats(s) {
      document.getElementById("statTotal").textContent = s.total || 0;
      document.getElementById("statPendientes").textContent = s.pendientes || 0;
      document.getElementById("statConfirmadas").textContent = s.confirmadas || 0;
      document.getElementById("statCompletadas").textContent = s.completadas || 0;
      document.getElementById("statHoy").textContent = s.hoy || 0;
    }

    function renderAppointmentView() {
      document.querySelectorAll("[data-appointments-view]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.appointmentsView === appointmentsView);
      });
      reservasList.classList.toggle("hidden", appointmentsView !== "list");
      calendarView.classList.toggle("hidden", appointmentsView !== "calendar");

      if (appointmentsView === "calendar") {
        renderCalendar(reservasCache);
      } else {
        renderReservas(reservasCache);
      }
    }

    function renderCalendar(reservas) {
      if (!reservas.length) {
        calendarView.innerHTML = `<div class="empty" style="grid-column:1/-1;">${t("noAppointments")}</div>`;
        return;
      }

      const grouped = reservas.reduce((acc, r) => {
        const key = r.fecha || t("notAvailable");
        if (!acc[key]) acc[key] = [];
        acc[key].push(r);
        return acc;
      }, {});

      const dates = Object.keys(grouped).sort();
      calendarView.innerHTML = dates.map(date => `
        <section class="calendar-day">
          <div class="calendar-date">${escapeHtml(date)}</div>
          ${grouped[date].map(r => `
            <button type="button" class="calendar-item" onclick="scrollToAppointment('${escapeAttr(r.id)}')">
              <strong>${escapeHtml(r.hora || "")} - ${escapeHtml(r.nombre || t("noName"))}</strong>
              ${escapeHtml(r.servicioResumen || "")}<br>
              ${escapeHtml(statusLabel(r.estado))}
            </button>
          `).join("")}
        </section>
      `).join("");
    }

                <span>${escapeHtml(r.id || "")} | ${escapeHtml(r.fecha || "")} ${escapeHtml(r.hora || "")}</span>

              <div><span>${t("vehicle")}</span><br>${escapeHtml(`${r.marca || ""} ${r.modelo || ""} ${r.ano || ""}`)}</div>
              <div><span>${escapeHtml(extraLabel)}</span><br>${escapeHtml(extraValue || t("notAvailable"))}</div>
              <div><span>${t("subtotal")}</span><br>${r.totalFinal ? "$" + escapeHtml(r.totalFinal) : t("notAvailable")}</div>
              <div><span>${t("discountLabel")}</span><br>${r.discountPercent ? escapeHtml(r.discountPercent) + "%" : t("notAvailable")}</div>
              ${r.clientFee ? `<div><span>Fee</span><br>$${escapeHtml(r.clientFee)}</div>` : ""}
              <div class="full"><span>${t("address")}</span><br>${escapeHtml(r.direccion || "")}</div>

            <div class="actions">
              ${editButton}
              <button class="btn success" onclick="actualizarEstado('${escapeAttr(r.id)}','Confirmada')">${t("confirm")}</button>
              <button class="btn warn" onclick="actualizarEstado('${escapeAttr(r.id)}','Pendiente')">${t("pending")}</button>
              <button class="btn danger" onclick="actualizarEstado('${escapeAttr(r.id)}','Cancelada')">${t("cancel")}</button>
              <button class="btn info" onclick="actualizarEstado('${escapeAttr(r.id)}','Completada')">${t("complete")}</button>
            </div>
          </article>

      if (!r) {
        alert(t("notFound"));
        return;
      }

      switchAdminForm("oil");

      setFormTitle();
      saveBtn.textContent = t("updateAppointment");

      document.getElementById("telefono").value = r.telefono || "";
      document.getElementById("correo").value = r.correo || "";

      document.getElementById("fecha").value = r.fecha || "";

      document.getElementById("estado").value = r.estado || "Pendiente";

        })
        .withFailureHandler(err => alert(err.message || t("statusError")))
        .adminActualizarEstado(adminToken, id, estado);

    function resetFormMode() {
      editingId = "";
      setFormTitle();
      saveBtn.textContent = t("createAppointment");
      saveBtn.disabled = false;
      cancelEditBtn.classList.add("hidden");
      document.getElementById("adminForm").reset();
      document.getElementById("adminLangField").value = currentLang;
      document.getElementById("aceptoAcuerdo").checked = true;
      document.getElementById("notificarCliente").checked = true;
      formMessage.textContent = "";
      resetMotor();
      resetOil();
      modeloSelect.innerHTML = placeholderOption("selectModel");
      anoSelect.innerHTML = placeholderOption("selectYear");
      renderMarcas();
    }

    function populateModelos() {
      modeloSelect.innerHTML = placeholderOption("selectModel");
      anoSelect.innerHTML = placeholderOption("selectYear");
      resetMotor();
      resetOil();

      const modelos = vehiculos
        .filter(v => String(v.marca || "").trim().toLowerCase() === marcaSelect.value)
        .map(v => String(v.modelo || "").trim().toLowerCase())
        .filter(Boolean);
      [...new Set(modelos)].forEach(m => addOption(modeloSelect, m, m));
    }

    function populateAnos() {
      anoSelect.innerHTML = placeholderOption("selectYear");
      resetMotor();
      resetOil();

      const anos = vehiculos
        .filter(v => String(v.marca || "").trim().toLowerCase() === marcaSelect.value &&
                     String(v.modelo || "").trim().toLowerCase() === modeloSelect.value)
        .map(v => String(v.ano || "").trim())
        .filter(Boolean);
      [...new Set(anos)].sort().forEach(a => addOption(anoSelect, a, a));
    }

    function resetMotor() {
      motorSelect.innerHTML = "";
      motorSelect.required = false;
      motorGroup.style.display = "none";
    }

    function resetOil() {
      marcaAceite.innerHTML = placeholderOption("selectOil");
      priceBox.textContent = `${t("estimatedPrice")}: ${t("notAvailable")}`;
    }

    function addOption(select, value, text) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = text;
      select.appendChild(opt);
    }

    function setSelectValue(select, value) {
      const stringValue = String(value || "");
      const exists = Array.from(select.options).some(opt => opt.value === stringValue);
      if (!exists && stringValue) addOption(select, stringValue, stringValue);
      select.value = stringValue;
    }

    function getVehicleMatches() {
      return vehiculos.filter(v =>
        String(v.ano || "").trim() === anoSelect.value &&
        normalizar(v.marca) === normalizar(marcaSelect.value) &&
        normalizar(v.modelo) === normalizar(modeloSelect.value) &&
        (!motorSelect.value || normalizarMotor(v.motor) === normalizarMotor(motorSelect.value))
      );
    }

    function getAdminDiscountRateFromText(text) {
      const haystack = String(text || "").toLowerCase();
      if (!haystack || !descuentosCache.length) return 0;

      return descuentosCache.reduce((best, discount) => {
        const code = String(discount.code || "").toLowerCase();
        const rate = Number(discount.rate || 0);
        if (!discount.active || !code || !rate || haystack.indexOf(code) === -1) return best;
        return Math.max(best, rate);
      }, 0);
    }

    function applyAdminDiscount(price, discountRate) {
      const amount = Number(price || 0);
      const rate = Number(discountRate || 0);
      return rate > 0 ? Math.max(0, amount - (amount * rate)) : amount;
    }

    function formatMoney(value) {
      return Number(value || 0).toFixed(2);
    }

    function formatPercent(rate) {
      const percent = Number(rate || 0) * 100;
      return (Math.round(percent) === percent ? String(percent) : percent.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")) + "%";
    }

    function calcularPrecioLocal() {
      const matches = getVehicleMatches();
      const match = matches[0];
      if (!match || !marcaAceite.value) return null;

      const precio = preciosAceite.find(p =>
        normalizar(p.tipo) === normalizar(match.aceite) &&
        normalizar(p.marca) === normalizar(marcaAceite.value)
      );
      if (!precio) return null;

      const capacidadOriginal = toNumber(match.capacidad);
      const capacidadLitros = convertirCapacidadALitros(match.capacidad, capacidadOriginal);
      const litrosBase = convertirCapacidadALitros("5 QT", 5);
      const aceiteBase = toNumber(precio.precioBase);
      const precio1L = toNumber(precio.precio1L);
      const filtro = toNumber(precio.filtro);
      const manoObra = toNumber(precio.manoObra);
      const desecho = toNumber(precio.desecho);
      const extraCantidad = capacidadLitros > litrosBase ? Math.ceil(capacidadLitros - litrosBase) : 0;
      const aceiteExtra = extraCantidad * precio1L;
      const aceite = aceiteBase + aceiteExtra;
      const total = aceite + filtro + manoObra + desecho;
      const discountRate = getAdminDiscountRateFromText(document.getElementById("comentarios").value);
      const finalTotal = applyAdminDiscount(total, discountRate);

      return {
        aceite: aceite.toFixed(2),
        aceiteBase: aceiteBase.toFixed(2),
        aceiteExtraCantidad: extraCantidad,
        aceiteExtra: aceiteExtra.toFixed(2),
        filtro: filtro.toFixed(2),
        manoObra: manoObra.toFixed(2),
        desecho: desecho.toFixed(2),
        baseTotal: total.toFixed(2),
        discountRate: discountRate,
        discountPercent: Number((discountRate * 100).toFixed(2)),
        total: finalTotal.toFixed(2)
      };
    }

    function normalizar(value) {
      return String(value || "").trim().toLowerCase();
    }

    function normalizarMotor(value) {
      return normalizar(value)
        .replace(/\s+/g, " ")
        .replace(/[()]/g, "")
        .replace(/\s*\/\s*/g, "/")
        .replace(/\s*-\s*/g, "-");
    }

    function toNumber(value) {
      if (typeof value === "number") return value;
      const parsed = parseFloat(String(value || "").replace(/[^0-9.-]/g, ""));
      return isNaN(parsed) ? 0 : parsed;
    }

    function convertirCapacidadALitros(rawValue, numericValue) {
      const text = String(rawValue || "").toLowerCase();
      const value = toNumber(numericValue);
      if (!value) return 0;
      if (text.indexOf("qt") !== -1 || text.indexOf("quart") !== -1) return value * 0.946352946;
      if (text.indexOf("l") !== -1 || text.indexOf("liter") !== -1 || text.indexOf("litro") !== -1) return value;
      return value * 0.946352946;
    }

    function toInputTime(value) {
      const text = String(value || "").trim();
      if (!text) return "";

      const match = text.match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp]\.?[Mm]\.?)?$/);
      if (!match) return text;

      let hour = Number(match[1]);
      const minute = String(Number(match[2] || 0)).padStart(2, "0");
      const suffix = String(match[3] || "").toUpperCase().replace(/\./g, "");

      if (suffix === "AM" && hour === 12) hour = 0;
      if (suffix === "PM" && hour < 12) hour += 12;

      if (hour < 0 || hour > 23) return "";
      return `${String(hour).padStart(2, "0")}:${minute}`;
    }

    function showFormError(err) {
      formMessage.textContent = err.message || String(err || t("somethingWrong"));
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(value) {
      return String(value == null ? "" : value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function cssEscape(value) {
      if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value || ""));
      return String(value || "").replace(/["\\]/g, "\\$&");
    }
  </script>
